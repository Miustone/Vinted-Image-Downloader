name: Build and Release

on:
  push:
    branches:
      - main  # Triggered automatically on every normal push to main

permissions:
  contents: write  # Required to create releases, tags, and upload assets

jobs:
  build-and-release:
    runs-on: windows-latest  # Builds natively on Windows runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          python -m PyInstaller --onefile --noconfirm --windowed --name "VintedImageDownloader" vinted_image_downloader.py

      - name: Parse Version & Changelog Section
        id: parse_changelog
        shell: powershell
        run: |
          if (Test-Path "CHANGELOG.md") {
              $content = Get-Content "CHANGELOG.md" -Raw
              
              # Find the very first version header (e.g., ## [1.3.0] or ## [V1.3.0])
              if ($content -match '##\s*\[?([vV]?\d+\.\d+\.\d+)\]?') {
                  $rawVersion = $matches[1]
                  # Ensure format is always capital 'V' (e.g. V1.3.0)
                  $cleanVersion = "V" + ($rawVersion -replace '^[vV]', '')
                  
                  # Extract section content for that specific version
                  $versionNumberOnly = $cleanVersion -replace '^[vV]', ''
                  $regex = "(?s)## \[?(?:[vV]?)$versionNumberOnly\]?.*?(?=(## \[\d+|## \[[vV]\d+|\z))"
                  
                  if ($content -match $regex) {
                      $notes = $matches[0].Trim()
                      Set-Content -Path "release_notes.md" -Value $notes
                  } else {
                      Set-Content -Path "release_notes.md" -Value "Release $cleanVersion"
                  }
                  
                  echo "version=$cleanVersion" >> $env:GITHUB_OUTPUT
              } else {
                  # Fallback if no version found in CHANGELOG.md
                  $fallback = "V1.0.${{ github.run_number }}"
                  Set-Content -Path "release_notes.md" -Value "Release $fallback"
                  echo "version=$fallback" >> $env:GITHUB_OUTPUT
              }
          } else {
              $fallback = "V1.0.${{ github.run_number }}"
              Set-Content -Path "release_notes.md" -Value "Release $fallback"
              echo "version=$fallback" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release and Upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse_changelog.outputs.version }}
          name: Vinted Image Downloader ${{ steps.parse_changelog.outputs.version }}
          body_path: release_notes.md
          files: dist/VintedImageDownloader.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}