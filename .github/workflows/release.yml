name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on v1.3.0, etc.
      - 'V*'  # Triggers on V1.3.0, etc.

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  build-and-release:
    runs-on: windows-latest  # Builds natively on Windows runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          python -m PyInstaller --onefile --name "VintedImageDownloader" vinted_image_downloader.py

      - name: Extract Changelog Section for Current Tag
        id: changelog
        shell: powershell
        run: |
          # Removes leading 'v' or 'V' if present (e.g., V1.3.0 -> 1.3.0)
          $RAW_TAG = "${{ github.ref_name }}"
          $VERSION = $RAW_TAG -replace '^[vV]', ''
          
          if (Test-Path "CHANGELOG.md") {
              $content = Get-Content "CHANGELOG.md" -Raw
              # Searches for ## [1.3.0], ## [V1.3.0], or ## [v1.3.0] in CHANGELOG.md
              $regex = "(?s)## \[?(?:[vV]?)$VERSION\]?.*?(?=(## \[\d+|## \[[vV]\d+|\z))"
              if ($content -match $regex) {
                  $notes = $matches[0].Trim()
                  Set-Content -Path "release_notes.md" -Value $notes
              } else {
                  Set-Content -Path "release_notes.md" -Value "Release $RAW_TAG"
              }
          } else {
              Set-Content -Path "release_notes.md" -Value "Release $RAW_TAG"
          }

      - name: Create GitHub Release and Upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vinted Image Downloader ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/VintedImageDownloader.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}